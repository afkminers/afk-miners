key: deer
kind: monster
image: "sprites/monsters/deer.png"

frame:
  width: 48
  height: 32
  margin: 0
  spacing: 0
  bleedFix: 0.0

grid:
  cols: 6
  rows: 12

anchor:
  x: 0.5
  y: 0.5

anims:
  idle:
    fps: 4
    frames: 4
    row: 0
    startCol: 0
    loop: true

  walk:
    fps: 8
    frames: 4
    framesByDir:
      south: 3
      east: 4
      west: 4
      north: 4
    rowByDir:
      south: 1
      east: 2
      west: 3
      north: 4
    seqByDir:
      south: [ 0, 1, 2 ]
    startCol: 0
    loop: true

  dead:
    fps: 8
    frames: 3
    row: 5
    startCol: 0
    loop: false

  attack:
    fps: 10
    frames: 2
    rowByDir:
      south: 6
      east: 7
      west: 8
      north: 9
    startCol: 0
    loop: false

# --- extra (usado pelo servidor/jogo, não interfere no draw) ---
stats:
  level: 3
  hp: 30
  exp: 18
loot:
- item_key: gold_coin # gold sempre 100%, range pequeno
  chance: 1.0
  min: 1
  max: 3
- item_key: raw_meat
  chance: 0.70
  min: 1
  max: 1
- item_key: deer_hide
  chance: 0.20
  min: 1
  max: 1
- item_key: antler_trinket # raro, bom pra vender
  chance: 0.02
  min: 1
  max: 1
