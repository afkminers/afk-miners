# data/sprites/monsters/deer.yml
key: deer
kind: monster
image: "sprites/monsters/deer.png"

frame:
  width: 48
  height: 32
  margin: 0
  spacing: 0
  bleedFix: 0.0 # opcional: se vazar pixels, suba p/ 0.25 (o código usa EPS interno)

grid:
  cols: 6
  rows: 12

# pivô centrado no 32×32 dentro do 48×32
anchor:
  x: 0.5
  y: 0.5

anims:
  # 0 — idle (4)
  idle:
    fps: 4
    frames: 4
    row: 0
    startCol: 0
    loop: true

  # 1..4 — walk (south 3; east/west/north 4)
  walk:
    fps: 8
    frames: 4 # default exigido pelo schema
    framesByDir:
      south: 3
      east: 4
      west: 4
      north: 4
    rowByDir:
      south: 1
      east: 2
      west: 3
      north: 4
    # Sequência específica p/ SOUTH (3 quadros). Evita pedir um 4º frame vazio.
    seqByDir:
      south: [ 0, 1, 2 ]
    startCol: 0
    loop: true

  # 5 — dead (3)
  dead:
    fps: 8
    frames: 3
    row: 5
    startCol: 0
    loop: false

  # 6..9 — attack (2 por direção)
  attack:
    fps: 10
    frames: 2
    rowByDir:
      south: 6
      east: 7
      west: 8
      north: 9
    startCol: 0
    loop: false
