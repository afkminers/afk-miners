# data/sprites/monsters/ghost.yml
key: ghost
kind: monster
image: "sprites/monsters/ghost.png"

frame:
  width: 32
  height: 32
  margin: 0
  spacing: 0

grid:
  cols: 6
  rows: 10

anchor:
  x: 0.5
  y: 0.55

anims:
  idle:
    fps: 6
    frames: 4
    row: 0
    startCol: 0
    loop: true

  walk:
    fps: 8
    frames: 6
    rowByDir:
      south: 1
      west: 2
      east: 3
      north: 4
    seqByDir:
      south: [ 0, 1, 2, 3 ]
    startCol: 0
    loop: true

  dead:
    fps: 8
    frames: 4
    row: 5
    startCol: 0
    loop: false
