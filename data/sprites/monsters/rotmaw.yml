# data/sprites/monsters/rotmaw.yml
key: rotmaw
kind: monster
image: "sprites/monsters/rotmaw.png"

frame:
  width: 48
  height: 32
  margin: 0
  spacing: 0

# imagem 288x384 → 6 colunas × 12 linhas
grid:
  cols: 6
  rows: 12

# pivô centralizado (32×32 dentro do 48×32 → 24,16) → 0.5, 0.5
anchor:
  x: 0.5
  y: 0.5

anims:
  # 0 — idle (4 frames)
  idle:
    fps: 4
    frames: 4
    row: 0
    startCol: 0
    loop: true

  # 1..4 — walk (south/west/east/north com 6 frames cada)
  walk:
    fps: 8
    frames: 6
    rowByDir:
      south: 1
      west: 2
      east: 3
      north: 4
    startCol: 0
    loop: true

  # 5 — dead (3 frames)
  dead:
    fps: 6
    frames: 3
    row: 5
    startCol: 0
    loop: false

  # 6..9 — attack (4 frames por direção)
  attack:
    fps: 10
    frames: 4
    rowByDir:
      south: 6
      west: 7
      east: 8
      north: 9
    startCol: 0
    loop: false

# --- extra (servidor) ---
stats:
  level: 12
  hp: 180
  exp: 95
loot:
  gold_coin:
    chance: 1.0
    amount: "4-8"
  rotten_meat:
    chance: 0.40
    amount: 1
  carrion_claw:
    chance: 0.10
    amount: 1
  crystal_shard:
    chance: 0.05
    amount: 1
  carrion_club:
    chance: 0.02
    amount: 1
