# data/sprites/monsters/demon_bonefiend.yml
key: demon_bonefiend
kind: monster
image: "sprites/monsters/demon_bonefiend.png"

frame:
  width: 64
  height: 64
  margin: 0
  spacing: 0
  bleedFix: 0.5 # pode subir pra 0.5 se ver “vazamento” de pixels

# 384x640 => 6 colunas × 10 linhas
grid:
  cols: 6
  rows: 10

anchor:
  x: 0.5
  y: 0.85

anims:
  # line 0 — idle (2 frames nas colunas 0 e 1)
  idle:
    fps: 4
    row: 0
    frames: 2
    startCol: 0
    seq: [ 0, 1 ]
    loop: true

  # lines 1..4 — walk (2 frames, sempre colunas 0 e 1)
  walk:
    fps: 8
    frames: 2
    startCol: 0
    rowByDir:
      south: 1
      east: 2
      west: 3
      north: 4
    seqByDir:
      south: [ 0, 1 ]
      east: [ 0, 1 ]
      west: [ 0, 1 ]
      north: [ 0, 1 ]
    loop: true

  # attacks — 2 frames, também só nas colunas 0 e 1
  attack:
    fps: 10
    frames: 2
    startCol: 0
    rowByDir:
      south: 5
      east: 6
      west: 8
      north: 9
    seqByDir:
      south: [ 0, 1 ]
      east: [ 0, 1 ]
      west: [ 0, 1 ]
      north: [ 0, 1 ]
    loop: false

  # dead — 4 frames na linha 7
  dead:
    fps: 8
    row: 8
    frames: 4
    startCol: 0
    seq: [ 0, 1, 2, 3 ]
    loop: false
