key: demon_bonefiend
kind: monster
image: "sprites/monsters/demon_bonefiend.png"

frame:
  width: 48
  height: 48
  margin: 2
  spacing: 4
  bleedFix: 0.5

grid:
  cols: 6
  rows: 12

anchor:
  x: 0.5
  y: 0.85

anims:
  idle:
    fps: 4
    row: 0
    frames: 4
    startCol: 0
    seq: [ 0, 1, 2, 3 ]
    loop: true

  walk:
    fps: 8
    frames: 4
    startCol: 0
    rowByDir:
      south: 1
      east: 2
      west: 3
      north: 4
    seqByDir:
      south: [ 0, 1, 2, 3 ]
      east: [ 0, 1, 2, 3 ]
      west: [ 0, 1, 2, 3 ]
      north: [ 0, 1, 2, 3 ]
    loop: true

  attack:
    fps: 10
    frames: 4 # ← 4 frames de ataque
    startCol: 0
    rowByDir:
      south: 7
      east: 7
      west: 8
      north: 9
    seqByDir:
      south: [ 0, 1, 2, 3 ]
      east: [ 0, 1, 2, 3 ]
      west: [ 0, 1, 2, 3 ]
      north: [ 0, 1, 2, 3 ]
    loop: false

  dead:
    fps: 8
    row: 5
    frames: 4
    startCol: 0
    seq: [ 0, 1, 2, 3 ]
    loop: false

# --- extra (servidor) ---
stats:
  level: 52
  hp: 1100
  exp: 720
loot:
  gold_coin:
    chance: 1.0
    amount: "6-12"
  bone_shard:
    chance: 0.70
    amount: "2-5"
  crystal_shard:
    chance: 0.10
    amount: 1
  darkblade:
    chance: 0.01
    amount: 1
  black_shield:
    chance: 0.01
    amount: 1
