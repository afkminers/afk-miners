key: demon_bonefiend
kind: monster
image: "sprites/monsters/demon_bonefiend.png"

frame:
  width: 48
  height: 48
  margin: 2
  spacing: 4
  bleedFix: 0.5

grid:
  cols: 6
  rows: 12

anchor:
  x: 0.5
  y: 0.85

anims:
  idle:
    fps: 4
    row: 0
    frames: 4
    startCol: 0
    seq: [ 0, 1, 2, 3 ]
    loop: true

  walk:
    fps: 8
    frames: 4
    startCol: 0
    rowByDir:
      south: 1
      east: 2
      west: 3
      north: 4
    seqByDir:
      south: [ 0, 1, 2, 3 ]
      east: [ 0, 1, 2, 3 ]
      west: [ 0, 1, 2, 3 ]
      north: [ 0, 1, 2, 3 ]
    loop: true

  attack:
    fps: 10
    frames: 4 # ← 4 frames de ataque
    startCol: 0
    rowByDir:
      south: 7
      east: 7
      west: 8
      north: 9
    seqByDir:
      south: [ 0, 1, 2, 3 ]
      east: [ 0, 1, 2, 3 ]
      west: [ 0, 1, 2, 3 ]
      north: [ 0, 1, 2, 3 ]
    loop: false

  dead:
    fps: 8
    row: 5
    frames: 4
    startCol: 0
    seq: [ 0, 1, 2, 3 ]
    loop: false

# --- extra (servidor) ---
stats:
  level: 52
  hp: 1100
  exp: 720
loot:
- item_key: gold_coin
  chance: 1.0
  min: 6
  max: 12
- item_key: bone_shard
  chance: 0.70
  min: 2
  max: 5
# Itens “signature” (garantidos no SQL acima):
- item_key: darkblade
  chance: 0.01
  min: 1
  max: 1
- item_key: black_shield
  chance: 0.01
  min: 1
  max: 1
