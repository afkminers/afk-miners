key: rat
kind: monster
image: "sprites/monsters/rat.png"

frame:
  width: 48
  height: 32
  margin: 0
  spacing: 0

grid:
  cols: 6
  rows: 12

anchor:
  x: 0.5
  y: 0.5

anims:
  idle:
    fps: 4
    frames: 4
    row: 0
    startCol: 0
    loop: true

  walk:
    fps: 8
    frames: 5
    framesByDir:
      south: 5
      west: 5
      east: 5
      north: 4
    rowByDir:
      south: 1
      west: 2
      east: 3
      north: 4
    startCol: 0
    loop: true

  dead:
    fps: 8
    frames: 4
    row: 5
    startCol: 0
    loop: false

  attack:
    fps: 10
    frames: 2
    rowByDir:
      west: 6
      east: 7
      south: 8
      north: 9
    startCol: 0
    loop: false

# --- extra (servidor) ---
stats:
  level: 2
  hp: 18
  exp: 8
loot:
- item_key: gold_coin
  chance: 1.0
  min: 1
  max: 2
- item_key: bone_shard
  chance: 0.50
  min: 1
  max: 2
- item_key: moldy_cheese
  chance: 0.05
  min: 1
  max: 1
# Se quiser usar a adaga enferrujada (garanti o SQL acima):
- item_key: rusty_dagger
  chance: 0.01
  min: 1
  max: 1

# Caso prefira reutilizar o que já existia, troque por rusty_sword:
