#data/sprites/monsters/rat.yml
key: rat
kind: monster
image: "sprites/monsters/rat.png"

frame:
  width: 48
  height: 32
  margin: 0
  spacing: 0

grid:
  cols: 6
  rows: 12

anchor:
  x: 0.5
  y: 0.5

anims:
  idle:
    fps: 4
    frames: 4
    row: 0
    startCol: 0
    loop: true

  walk:
    fps: 8
    frames: 5
    framesByDir:
      south: 5
      west: 5
      east: 5
      north: 4
    rowByDir:
      south: 1
      west: 2
      east: 3
      north: 4
    startCol: 0
    loop: true

  dead:
    fps: 8
    frames: 4
    row: 5
    startCol: 0
    loop: false

  attack:
    fps: 10
    frames: 2
    rowByDir:
      west: 6
      east: 7
      south: 8
      north: 9
    startCol: 0
    loop: false
