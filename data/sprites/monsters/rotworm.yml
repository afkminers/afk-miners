# data/sprites/monsters/rotworm.yml
key: rotworm
kind: monster
image: "sprites/monsters/rotworm.png"

frame:
  width: 32
  height: 32
  margin: 1
  spacing: 2

# imagem 288x384 → 6 colunas × 12 linhas
grid:
  cols: 6
  rows: 10

# pivô centralizado (32×32 dentro do 48×32 → 24,16) → 0.5, 0.5
anchor:
  x: 0.5
  y: 0.5

anims:
  # 0 — idle (4 frames)
  idle:
    fps: 4
    frames: 4
    row: 0
    startCol: 0
    loop: true

  # 1..4 — walk (south/west/east/north com 6 frames cada)
  walk:
    fps: 8
    frames: 4
    rowByDir:
      south: 1
      west: 3
      east: 2
      north: 4
    startCol: 0
    loop: true

  # 5 — dead (3 frames)
  dead:
    fps: 6
    frames: 4
    row: 5
    startCol: 0
    loop: false

  # 6..9 — attack (4 frames por direção)
  attack:
    fps: 10
    frames: 4
    rowByDir:
      south: 6
      west: 7
      east: 8
      north: 9
    startCol: 0
    loop: false
