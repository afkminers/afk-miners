# data/sprites/monsters/bear.yml
key: bear
kind: monster
image: "sprites/monsters/bear.png"

frame:
  width: 48
  height: 48
  margin: 0
  spacing: 0
  bleedFix: 0.25 # ajuda a evitar “vazar” pixel do próximo frame

# A imagem final deve ser 288x624 → 6 colunas de 48 e 13 linhas de 48
grid:
  cols: 6
  rows: 10

# pivô um pouco abaixo do centro para “assentar” no chão
anchor:
  x: 0.5
  y: 0.5

anims:
  # 0 — idle (5 frames)
  idle:
    fps: 4
    frames: 5
    row: 0
    startCol: 0
    loop: true

  # 1..4 — walk (direções em linhas 1 a 4)
  walk:
    fps: 8
    frames: 5
    rowByDir:
      south: 1
      west: 2
      east: 3
      north: 4
    startCol: 0
    loop: true

  # 12 — dead (3 frames)  ← use a linha correta se for outra
  dead:
    fps: 8
    frames: 3
    row: 12
    startCol: 0
    loop: false

  # 6..9 — attack (2 frames por direção)
  attack:
    fps: 10
    frames: 2
    rowByDir:
      south: 6
      west: 7
      east: 8
      north: 9
    startCol: 0
    loop: false
