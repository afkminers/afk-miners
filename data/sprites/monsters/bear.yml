# data/sprites/monsters/bear.yml
key: bear
kind: monster
image: "sprites/monsters/bear.png"

frame:
  width: 48
  height: 48
  margin: 2
  spacing: 4
  bleedFix: 0.25

grid:
  cols: 6
  rows: 12

anchor:
  x: 0.5
  y: 0.82

anims:
  idle:
    fps: 4
    frames: 5
    row: 0
    startCol: 0
    loop: true

  walk:
    fps: 8
    frames: 5 # padrão
    framesByDir:
      # override por direção
      south: 5
      west: 5
      east: 5
      north: 4 # ← só 4 no north
    rowByDir:
      south: 1
      west: 2
      east: 3
      north: 4
    startCol: 0
    loop: true

  dead:
    fps: 8
    frames: 3
    row: 5 # ← linha de “morto” (ajuste se for outra)
    startCol: 0
    loop: false

  attack:
    fps: 10
    frames: 2
    rowByDir:
      south: 6
      west: 7
      east: 8
      north: 9
    startCol: 0
    loop: false
