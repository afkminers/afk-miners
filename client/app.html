<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8" />
<title>AFK Miners — Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="stylesheet" href="/css/app.css" />

<body>
  <header class="topbar">
    <div class="brand">AFK MINERS</div>
    <nav class="actions">
      <button id="btnSkills">Skills</button>
      <button id="btnHeroes">Heroes</button>
      <button id="btnInventory">Inventory</button>
      <button id="btnSummon">Summon</button>
      <button id="btnLogout" class="danger">Logout</button>
    </nav>
  </header>

  <!-- LAYOUT ESTILO TIBIA: esquerda / centro (viewport) / direita -->
  <main id="tibiaLayout">
    <!-- STACK ESQUERDO -->
    <aside id="leftStack" class="stack" aria-label="Left stack"></aside>
    <div id="splitLeft" class="splitter v"></div>

    <!-- VIEWPORT CENTRAL (PRIORIDADE MÁXIMA) -->
    <section id="centerStage">
      <div id="clientShell">
        <canvas id="scene" width="960" height="540"></canvas>
        <div id="hud" class="hud"></div>
      </div>
    </section>

    <div id="splitRight" class="splitter v"></div>
    <!-- STACK DIREITO (minimapa no topo, painéis abaixo) -->
    <aside id="rightStack" class="stack" aria-label="Right stack">
      <div class="panel mini-map" data-fixed="1" aria-label="Mini map">
        <header><h3>Mini-Map</h3></header>
        <div class="body">
          <canvas id="miniMap" width="140" height="140"></canvas>
        </div>
      </div>
      <!-- os demais painéis entram aqui via JS -->
    </aside>

    <!-- CHAT FIXO EMBAIXO -->
    <footer id="chatDock">
      <div class="tabs">
        <button data-chat="default" class="active">Default</button>
        <button data-chat="global">Global</button>
      </div>
      <div id="chatLog" class="log"></div>
      <form id="chatForm" autocomplete="off">
        <input id="chatInput" placeholder="Digite uma mensagem…" />
      </form>
    </footer>
  </main>

  <!-- MODAL SUMMON POP-UP -->
  <div id="summonModal" class="modal" hidden>
    <div class="window">
      <header>
        <h3>Summon</h3>
        <button class="close" aria-label="Close">Close</button>
      </header>
      <iframe id="summonFrame" src="/index.html#summon?embed=1" allow="fullscreen"></iframe>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>

  <style>
    /* segurança: nada de sidebars legadas aparecendo */
    .sidebar, .rightbar { display:none !important; }
  </style>
</body>
</html>
