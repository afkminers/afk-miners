<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <title>AFK Miners — Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/chat-stable.css" />
  <link rel="stylesheet" href="/css/chat-context.css" />

  <!-- Fonte usada pelo HUD -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    .sidebar,
    .rightbar {
      display: none !important;
    }

    #clientShell {
      position: relative;
    }

    #leftStack .panel {
      border: 1px solid rgba(255, 255, 255, .06);
      border-radius: 8px;
      background: #0b1220;
    }

    #leftStack .panel header {
      padding: 8px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, .06);
    }

    #leftStack .panel .body {
      padding: 8px;
    }

    /* === Drawer de Equipamentos no lado esquerdo === */
    #leftStack {
      position: relative;
    }

    .equip-drawer {
      position: absolute;
      top: 8px;
      left: 8px;
      bottom: 8px;
      width: 360px;
      max-width: calc(100% - 16px);
      background: #0b1220;
      color: #e6eef6;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, .4);
      transform: translateX(-110%);
      transition: transform 220ms ease-out;
      display: flex;
      flex-direction: column;
      z-index: 5;
    }

    .equip-drawer.open {
      transform: translateX(0);
    }

    .equip-drawer header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, .08);
    }

    .equip-drawer .content {
      padding: 12px;
      overflow: auto;
      gap: 12px;
      display: grid;
      grid-template-rows: auto auto;
    }

    .equip-card {
      border: 1px solid rgba(255, 255, 255, .06);
      background: rgba(17, 24, 39, .6);
      border-radius: 12px;
      padding: 10px;
    }

    .equip-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .slot,
    .item {
      border: 1px solid rgba(255, 255, 255, .05);
      background: rgba(2, 6, 23, .6);
      border-radius: 10px;
      padding: 10px;
    }

    .slot .box,
    .item .box {
      height: 64px;
      border-radius: 8px;
      background: rgba(15, 23, 42, .6);
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    /* ==== Barra de Skill (hover animado + % centralizada) ==== */
    .skill-bar {
      position: relative;
      margin-top: 6px;
      height: 14px;
      border-radius: 999px;
      background: rgba(148, 163, 184, .18);
      overflow: hidden;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .skill-bar:hover {
      transform: translateY(-1px);
      box-shadow:
        inset 0 6px 16px rgba(0, 0, 0, .25),
        0 2px 8px rgba(0, 0, 0, .25);
    }

    .skill-fill {
      height: 100%;
      background: #4f46e5;
      transition: width .35s ease, filter .2s ease;
      will-change: width;
    }

    .skill-bar:hover .skill-fill {
      filter: brightness(1.15) saturate(1.1);
    }

    .skill-label {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 12px;
      color: #cbd5e1;
      mix-blend-mode: screen;
      text-shadow: 0 1px 1px rgba(0, 0, 0, .6);
      pointer-events: none;
    }

    .lang-switcher {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .lang-switcher__button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      padding: 4px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      background: rgba(30, 41, 59, 0.7);
      color: #e2e8f0;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      cursor: pointer;
    }

    .lang-switcher__button:hover,
    .lang-switcher__button:focus,
    .lang-switcher__button.is-open {
      outline: none;
      filter: brightness(1.1);
    }

    .lang-switcher__flag svg {
      width: 18px;
      height: 12px;
      display: block;
      box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.4);
    }

    .lang-switcher__code {
      display: none;
    }

    .lang-switcher__menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      min-width: 160px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.45);
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .lang-switcher__option {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid transparent;
      background: transparent;
      color: #e2e8f0;
      cursor: pointer;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
    }

    .lang-switcher__option:hover,
    .lang-switcher__option:focus {
      outline: none;
      border-color: rgba(148, 163, 184, 0.4);
      background: rgba(30, 41, 59, 0.8);
    }

    .lang-switcher__option.is-active {
      border-color: rgba(96, 165, 250, 0.6);
      background: rgba(37, 99, 235, 0.25);
    }

    .lang-switcher__option-flag svg {
      width: 18px;
      height: 12px;
      display: block;
      box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.4);
    }

    .lang-switcher__sr {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    /* BACKPACK-ONLY: desativa Inventário da Conta na interface */
    #btnInventory { display: none !important; }        /* some o botão do topo */
    .equip-card[data-inv-container] { display: none !important; } /* some o card */

  </style>
</head>

<body>

  <!-- ========= UI: Team + Skills + Equipamentos ========= -->
  <script type="text/babel" data-presets="react,env">
    // @ts-nocheck

    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    function interpolateFallback(template, vars) {
      if (typeof template !== 'string') return template;
      if (!vars || typeof vars !== 'object') return template;
      return template.replace(/\{(\w+)\}/g, (_, token) => {
        if (Object.prototype.hasOwnProperty.call(vars, token)) {
          const value = vars[token];
          return value == null ? '' : String(value);
        }
        return `{${token}}`;
      });
    }

    function useI18n() {
      const [lang, setLang] = useState(() => {
        if (window.i18n && typeof window.i18n.getLang === 'function') {
          return window.i18n.getLang();
        }
        return 'en';
      });

      useEffect(() => {
        if (!window.i18n) return;
        const update = () => {
          try {
            setLang(window.i18n.getLang());
          } catch (_) {
            setLang((prev) => prev);
          }
        };
        window.i18n.onReady(update);
        window.i18n.onChange(update);
      }, []);

      const t = useCallback((key, vars) => {
        if (window.i18n && typeof window.i18n.t === 'function') {
          return window.i18n.t(key, vars);
        }
        return interpolateFallback(key, vars);
      }, [lang]);

      return { lang, t };
    }

    const CLASS_LABEL_KEYS = {
      knight: 'class.Knight',
      sorcerer: 'class.Sorcerer',
      druid: 'class.Druid',
      archer: 'class.Archer',
      ranger: 'class.Ranger',
    };

    const SLOT_LABEL_KEYS = {
      AMULET: 'app.slots.AMULET',
      HELMET: 'app.slots.HELMET',
      BACK: 'app.slots.BACK',
      WEAPON: 'app.slots.WEAPON',
      ARMOR: 'app.slots.ARMOR',
      SHIELD: 'app.slots.SHIELD',
      RING: 'app.slots.RING',
      LEGS: 'app.slots.LEGS',
      BOOTS: 'app.slots.BOOTS',
    };

    const SKILL_LABEL_KEYS = {
      distance: 'skills.distance',
      'distance_fighting': 'skills.distance',
      'distance fighting': 'skills.distance',
      magic: 'skills.magic',
      'magic_level': 'skills.magic',
      'magic level': 'skills.magic',
      shielding: 'skills.shield',
      shield: 'skills.shield',
      sword: 'skills.sword',
      'sword_fighting': 'skills.sword',
      'sword fighting': 'skills.sword',
      axe: 'skills.axe',
      'axe_fighting': 'skills.axe',
      'axe fighting': 'skills.axe',
      club: 'skills.club',
      'club_fighting': 'skills.club',
      'club fighting': 'skills.club',
    };

    function titleCase(value) {
      return String(value || '')
        .toLowerCase()
        .split(/[_\s]+/)
        .filter(Boolean)
        .map((word) => word.charAt(0).toUpperCase() + word.slice(1))
        .join(' ');
    }

    function translateClassName(value, t) {
      const normalized = String(value || '').trim();
      if (!normalized) return t('lb.unknown');
      const key = CLASS_LABEL_KEYS[normalized.toLowerCase()];
      if (key) return t(key);
      return titleCase(normalized);
    }

    function translateSlot(slot, t) {
      const normalized = String(slot || '').toUpperCase();
      const key = SLOT_LABEL_KEYS[normalized];
      if (key) return t(key);
      return titleCase(normalized);
    }

    function translateSkillName(name, t) {
      const normalized = String(name || '').trim().toLowerCase();
      if (!normalized) return t('lb.unknown');
      const key = SKILL_LABEL_KEYS[normalized] || SKILL_LABEL_KEYS[normalized.replace(/[-\s]+/g, '_')];
      if (key) return t(key);
      return titleCase(normalized);
    }

    function formatNumber(value) {
      if (window.i18n && window.i18n.format && typeof window.i18n.format.number === 'function') {
        return window.i18n.format.number(value);
      }
      if (value == null) return '';
      return String(value);
    }

    function heroMeta(hero, t) {
      const className = translateClassName(hero?.class, t);
      const levelValue = hero?.level ?? 1;
      return t('app.hero.meta', { className, level: formatNumber(levelValue) });
    }

    /* ============== utils ============== */
    function getCookie(name) {
      const parts = document.cookie.split(";").map(s => s.trim());
      for (const p of parts) if (p.startsWith(name + "=")) return decodeURIComponent(p.substring(name.length + 1));
      return "";
    }
    async function ensureCsrf() {
      try { await fetch("/api/auth/csrf", { credentials: "include" }); } catch { }
      try { await fetch("/api/csrf", { credentials: "include" }); } catch { }
    }
    async function getJSON(url) {
      const r = await fetch(url, { credentials: "include" });
      if (!r.ok) throw new Error('GET ' + url + ' -> ' + r.status);
      return r.json();
    }
    async function postJSON(url, body) {
      const send = () => fetch(url, {
        method: "POST", credentials: "include",
        headers: { "Content-Type": "application/json", "X-CSRF-Token": getCookie("csrf") || "" },
        body: JSON.stringify(body || {})
      });
      let r = await send();
      if (r.status === 403) { await ensureCsrf(); r = await send(); }
      if (!r.ok) throw new Error('POST ' + url + ' -> ' + r.status);
      return r.json();
    }

    /* ============== anim “voar” ============== */
    function animateFly(fromEl, toEl, imgSrc) {
      if (!fromEl || !toEl) return;
      const fr = fromEl.getBoundingClientRect();
      const tr = toEl.getBoundingClientRect();
      const img = new Image();
      img.src = imgSrc || ""; img.alt = "";
      Object.assign(img.style, {
        position: "fixed",
        left: (fr.left + fr.width / 2 - 16) + 'px',
        top: (fr.top + fr.height / 2 - 16) + 'px',
        width: "32px", height: "32px",
        pointerEvents: "none", zIndex: 100000,
        transition: "transform .38s ease, opacity .38s ease",
        transform: "translate(0,0) scale(1)", opacity: "1",
      });
      document.body.appendChild(img);
      const dx = (tr.left + tr.width / 2) - (fr.left + fr.width / 2);
      const dy = (tr.top + tr.height / 2) - (fr.top + fr.height / 2);
      requestAnimationFrame(() => {
        img.style.transform = 'translate(' + dx + 'px, ' + dy + 'px) scale(.75)';
        img.style.opacity = "0.85";
      });
      setTimeout(() => { img.style.opacity = "0"; setTimeout(() => { try { document.body.removeChild(img); } catch { } }, 180); }, 380);
    }

    /* ============== domínio ============== */
    const ORDERED_SLOTS = ["AMULET", "HELMET", "BACK", "WEAPON", "ARMOR", "SHIELD", "RING", "LEGS", "BOOTS"];


    /* ============== Team (botões Skills/Equips) ============== */
    function TeamShell() {
      const [loading, setLoading] = useState(true);
      const [heroes, setHeroes] = useState([]);
      const [equipHero, setEquipHero] = useState(null);
      const [skillsHero, setSkillsHero] = useState(null);
      const [error, setError] = useState("");
      const { t } = useI18n();

      useEffect(() => {
        let live = true;
        (async () => {
          try {
            const me = await getJSON("/api/player/me");
            if (!live) return;
            setHeroes((me.heroes || []).slice(0, 3));
          } catch (e) {
            setError(e.message || String(e));
          } finally {
            setLoading(false);
          }
        })();
        return () => { live = false; };
      }, []);

      if (loading) return <div style={{ color: "#9aa4b2", fontSize: 12 }}>{t('app.panel.teamLoading')}</div>;
      if (error) return <div style={{ color: "#ef4444", fontSize: 12 }}>{error}</div>;
      if (!heroes.length) return <div style={{ color: "#9aa4b2", fontSize: 12 }}>{t('app.panel.noHeroes')}</div>;

      return (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {heroes.map(h => (
            <div key={h.id}
              style={{
                display: "flex", alignItems: "center", gap: 10, borderRadius: 14, background: "rgba(31,41,55,.8)",
                padding: "8px 10px", boxShadow: "0 2px 8px rgba(0,0,0,.25)", color: "#fff",
                border: "1px solid rgba(255,255,255,.06)"
              }}>
              <div style={{
                height: 36, width: 36, borderRadius: 999, background: "linear-gradient(135deg,#818cf8,#3730a3)",
                display: "grid", placeItems: "center", boxShadow: "inset 0 2px 6px rgba(0, 0, 0, .25)"
              }}>
                <span style={{ fontSize: 12, fontWeight: 700, textShadow: "0 1px 2px #000" }}>{(h.class || "?").slice(0, 1)}</span>
              </div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{
                  fontSize: 13, fontWeight: 700, lineHeight: "16px", overflow: "hidden",
                  textOverflow: "ellipsis", whiteSpace: "nowrap"
                }}>{h.name}</div>
                <div style={{ fontSize: 11, opacity: .8 }}>{heroMeta(h, t)}</div>
              </div>
              <div style={{ display: "flex", gap: 6 }}>
                <button onClick={() => setSkillsHero(h)} title={t('app.nav.skills')}
                  style={{ fontSize: 11, padding: "4px 8px", borderRadius: 8, background: "#0ea5e9", color: "#002", border: "0", fontWeight: 700 }}>
                  {t('app.nav.skills')}
                </button>
                <button onClick={() => setEquipHero(h)} title={t('app.panel.equip')}
                  style={{ fontSize: 11, padding: "4px 8px", borderRadius: 8, background: "#4f46e5", color: "#fff", border: "0", fontWeight: 700 }}>
                  {t('app.panel.equip')}
                </button>
              </div>
            </div>
          ))}

          {/* Drawer de Equipamentos no leftStack (não esconde nada) */}
          <EquipmentDrawer open={!!equipHero} hero={equipHero} onClose={() => setEquipHero(null)} />

          {skillsHero && <SkillsDrawer hero={skillsHero} onClose={() => setSkillsHero(null)} />}
        </div>
      );
    }

    /* ============== Drawer de Equipamentos (lado esquerdo) ============== */
    function EquipmentDrawer({ open, hero, onClose }) {
      const { t } = useI18n();
      const [equip, setEquip] = useState([]);
      const [inventory, setInventory] = useState([]);
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState("");
      const rootRef = useRef(null);

      const equipBySlot = useMemo(() => {
        const m = new Map();
        (equip || []).forEach(r => m.set(String(r.slot).toUpperCase(), r));
        return m;
      }, [equip]);

      useEffect(() => {
        if (!open || !hero) return;
        let live = true;
        (async () => {
          try {
            const [eq, inv] = await Promise.all([
              getJSON('/api/equipment/' + hero.id),
              getJSON('/api/inventory')
            ]);
            if (!live) return;
            setEquip(eq.equipment || []);
            setInventory(inv.items || []);
          } catch (e) {
            setErr(e.message || String(e));
          }
        })();
        return () => { live = false; };
      }, [open, (hero && hero.id)]);

      async function refreshBoth() {
        const [eq, inv] = await Promise.all([
          getJSON('/api/equipment/' + hero.id),
          getJSON('/api/inventory')
        ]);
        setEquip(eq.equipment || []);
        setInventory(inv.items || []);
      }

      // helpers inventário
      const invIndex = (arr, key) => arr.findIndex(x => String(x.item_key) === String(key));
      function invDec(arr, key) {
        const i = invIndex(arr, key); if (i === -1) return arr.slice();
        const next = arr.slice(); const cur = { ...next[i] };
        cur.qty = Math.max(0, Number(cur.qty || 0) - 1);
        if (cur.qty <= 0) next.splice(i, 1); else next[i] = cur;
        return next;
      }
      function invInc(arr, key, meta) {
        const i = invIndex(arr, key);
        if (i === -1)
          return [...arr, meta ? { ...meta, item_key: key, qty: 1 } : { item_key: key, qty: 1, name: key, slot: "MISC" }];
        const next = arr.slice(); const cur = { ...next[i] };
        cur.qty = Number(cur.qty || 0) + 1; next[i] = cur;
        return next;
      }
      function setSlot(arr, slot, rowOrNull) {
        const SLOT = String(slot).toUpperCase();
        const next = (arr || []).slice();
        const idx = next.findIndex(r => String(r.slot).toUpperCase() === SLOT);
        if (rowOrNull) {
          const newRow = {
            slot: SLOT,
            item_key: rowOrNull.item_key || rowOrNull.key || null,
            name: rowOrNull.name || rowOrNull.item_key || rowOrNull.key || null,
            sprite: rowOrNull.sprite || null,
            weapon_type: rowOrNull.weapon_type || null,
            atk: rowOrNull.atk || 0,
            def: rowOrNull.def || 0,
          };
          if (idx === -1) next.push(newRow); else idx >= 0 && (next[idx] = { ...next[idx], ...newRow });
        } else {
          if (idx === -1) next.push({ slot: SLOT, item_key: null }); else next[idx] = { slot: SLOT, item_key: null };
        }
        return next;
      }

      function findInvPic(key) {
        return rootRef.current?.querySelector('[data-inv-item-key="' + CSS.escape(String(key)) + '"] .inv-pic') || null;
      }
      function findSlotPic(slot) {
        return rootRef.current?.querySelector('[data-eq-slot="' + CSS.escape(String(slot).toUpperCase()) + '"] .eq-pic') || null;
      }

      async function onEquip(slot, itemKey) {
        if (busy) return; setBusy(true); setErr("");
        const SLOT = String(slot).toUpperCase();
        const prev = equipBySlot.get(SLOT); const prevKey = prev?.item_key || null;
        const meta = inventory.find(x => String(x.item_key) === String(itemKey)) || null;

        const from = findInvPic(itemKey), to = findSlotPic(SLOT), sprite = meta?.sprite || "";

        // otimista
        setEquip(cur => setSlot(cur, SLOT, meta || { item_key: itemKey, name: itemKey }));
        setInventory(cur => invDec(cur, itemKey));
        if (prevKey) setInventory(cur => invInc(cur, prevKey, prev));

        try { if (from && to) animateFly(from, to, sprite); } catch { }

        try {
          await postJSON("/api/equipment/equip", { heroId: hero.id, slot: SLOT, itemKey });
          await refreshBoth();
        } catch (e) {
          setErr(e.message || String(e));
          // rollback
          setEquip(cur => { let next = setSlot(cur, SLOT, null); if (prevKey) next = setSlot(next, SLOT, prev); return next; });
          setInventory(cur => invInc(cur, itemKey, meta));
          if (prevKey) setInventory(cur => invDec(cur, prevKey));
        } finally { setBusy(false); }
      }

      async function onUnequip(slot) {
        if (busy) return; setBusy(true); setErr("");
        const SLOT = String(slot).toUpperCase();
        const prev = equipBySlot.get(SLOT); const prevKey = prev?.item_key || null;
        if (!prevKey) { setBusy(false); return; }

        const from = findSlotPic(SLOT);
        const invContainer = rootRef.current?.querySelector("[data-inv-container]");
        const to = invContainer || rootRef.current; const sprite = prev?.sprite || "";

        // otimista
        setEquip(cur => setSlot(cur, SLOT, null));
        setInventory(cur => invInc(cur, prevKey, prev));
        try { if (from && to) animateFly(from, to, sprite); } catch { }

        try {
          await postJSON("/api/equipment/equip", { heroId: hero.id, slot: SLOT, itemKey: null });
          await refreshBoth();
        } catch (e) {
          setErr(e.message || String(e));
          // rollback
          setEquip(cur => setSlot(cur, SLOT, prev));
          setInventory(cur => invDec(cur, prevKey));
        } finally { setBusy(false); }
      }

      // Liga a Backpack UI quando o drawer abre
      useEffect(() => {
        if (!open || !hero) return;
        try { window.ActiveHeroId = String(hero.id); } catch { }
        try { window.BackpackUI?.render(hero.id); } catch { }
        try { window.BackpackUI?.bindContextOpen(() => hero.id); } catch { }
      }, [open, (hero && hero.id), (equip ? equip.length : 0)]);

      return (
        <div ref={rootRef} className={"equip-drawer " + (open ? "open" : "")} aria-hidden={!open}>
          <header>
            <div>
              <div style={{ fontWeight: 700 }}>{hero?.name || t('app.hero.unknown')}</div>
              <div style={{ fontSize: 12, opacity: .75 }}>{heroMeta(hero, t)}</div>
            </div>
            <button
              onClick={onClose}
              style={{ padding: "6px 10px", borderRadius: 8, background: "#111827", color: "#e6eef6", border: "1px solid rgba(255,255,255,.08)" }}
              disabled={!open || busy}
            >
              {t('common.close')}
            </button>
          </header>

          {err && <div style={{ padding: "8px 12px", color: "#fda4af", fontSize: 13 }}>{err}</div>}

          <div className="content">
            {/* Equipamentos */}
            <div className="equip-card">
              <div style={{ marginBottom: 8, fontSize: 14, opacity: .85 }}>{t('app.panel.equip')}</div>
              <div className="equip-grid">
                {ORDERED_SLOTS.map(slot => {
                  const row = equipBySlot.get(slot);
                  return (
                    <div key={slot} data-eq-slot={slot} className="slot">
                      <div style={{ fontSize: 11, color: "#9aa4b2", marginBottom: 6 }}>{translateSlot(slot, t)}</div>
                      <div className="box eq-pic">
                        {row?.sprite
                          ? <img src={row.sprite} alt={row.name || row.item_key} style={{ maxHeight: 64, objectFit: "contain" }} />
                          : row?.item_key
                            ? <span style={{ fontSize: 10, color: "#cbd5e1" }}>{row.name || row.item_key}</span>
                            : <span style={{ fontSize: 10, color: "#64748b" }}>{t('app.equipment.emptySlot')}</span>}
                      </div>
                      <div style={{ marginTop: 8 }}>
                        {row?.item_key
                          ? <button
                            onClick={() => onUnequip(slot)}
                            disabled={busy}
                            style={{ fontSize: 12, padding: "4px 8px", borderRadius: 6, background: "#374151", color: "#e6eef6", border: "1px solid rgba(255,255,255,.06)", opacity: busy ? .6 : 1 }}
                          >
                            {t('app.equipment.unequip')}
                          </button>
                          : <span style={{ fontSize: 11, color: "#6b7280" }}>—</span>}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Backpack (renderizada pela BackpackUI) */}
            <div className="equip-card">
              <div style={{ marginBottom: 8, fontSize: 14, opacity: .85 }}>{t('app.equipment.backpack')}</div>
              <div
                id="app-inventory"
                style={{
                  marginTop: 6,
                  background: "rgba(2,6,23,.6)",
                  border: "1px solid rgba(255,255,255,.05)",
                  borderRadius: 10
                }}
              />
            </div>

            {/* Inventário da conta */}
            <div className="equip-card" data-inv-container>
              <div style={{ marginBottom: 8, fontSize: 14, opacity: .85 }}>{t('app.equipment.account')}</div>
              <div className="equip-grid">
                {(inventory || []).map(it => {
                  const slot = String(it.slot || "").toUpperCase();
                  const canEquip = ORDERED_SLOTS.includes(slot);
                  return (
                    <div key={it.item_key} data-inv-item-key={it.item_key} className="item">
                      <div
                        title={it.name || it.item_key}
                        style={{ fontSize: 11, color: "#9aa4b2", marginBottom: 6, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}
                      >
                        {it.name || it.item_key}
                      </div>
                      <div className="box inv-pic">
                        {it.sprite
                          ? <img src={it.sprite} alt={it.name || it.item_key} style={{ maxHeight: 64, objectFit: "contain" }} />
                          : <span style={{ fontSize: 10, color: "#64748b" }}>{t('app.equipment.noSprite')}</span>}
                      </div>
                      <div style={{ marginTop: 8, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
                        <span style={{ fontSize: 10, color: "#94a3b8" }}>{t('app.equipment.qty', { qty: formatNumber(it.qty) })}</span>
                        {canEquip
                          ? <button
                            onClick={() => onEquip(slot, it.item_key)}
                            disabled={busy || Number(it.qty) <= 0}
                            style={{ fontSize: 12, padding: "4px 8px", borderRadius: 6, background: "#4f46e5", color: "#fff", border: 0, opacity: busy ? .6 : 1 }}
                          >
                            {t('app.equipment.equip')}
                          </button>
                          : <span style={{ fontSize: 10, color: "#6b7280" }}>—</span>}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        </div>
      );
    }


    /* ============== Skills Drawer (polling + botão fixo) ============== */
    function SkillsDrawer({ hero, onClose }) {
      const { t } = useI18n();
      const [rows, setRows] = useState([]);
      const [err, setErr] = useState("");
      const ref = useRef(null);

      // endpoint escolhido e timer de polling
      const endpointRef = useRef(null);
      const pollRef = useRef(null);

      const SKILL_ENDPOINTS = [
        (id) => '/api/skills/hero/' + id,
        (id) => '/api/skills?heroId=' + encodeURIComponent(id),
        (id) => '/api/hero/' + id + '/skills',
        (id) => '/api/heroes/' + id + '/skills',
        (id) => '/api/player/hero/' + id + '/skills',
      ];

      function normalizeSkillsPayload(data) {
        if (!data) return [];
        if (Array.isArray(data)) return data;
        if (Array.isArray(data.skills)) return data.skills;
        if (Array.isArray(data.rows)) return data.rows;
        if (data && Array.isArray(data.data)) return data.data;
        return [];
      }

      async function fetchSkillsOnce() {
        const url = endpointRef.current;
        if (!url) return;
        const r = await fetch(url, { credentials: "include" });
        if (!r.ok) return;
        const list = normalizeSkillsPayload(await r.json());
        setRows(list);
        try { window.SkillAdvance?.monitor.update(hero.id, hero.name, list); } catch { }
      }

      useEffect(() => {
        let live = true;

        (async () => {
          try {
            if (typeof window.SKILLS_ENDPOINT === "function") {
              endpointRef.current = window.SKILLS_ENDPOINT(hero.id);
              await fetchSkillsOnce();
            } else {
              for (const build of SKILL_ENDPOINTS) {
                const url = build(hero.id);
                const r = await fetch(url, { credentials: "include" });
                if (r.status === 404) continue;
                if (!r.ok) throw new Error('GET ' + url + ' -> ' + r.status);
                endpointRef.current = url;
                const list = normalizeSkillsPayload(await r.json());
                if (!live) return;
                setRows(list);
                try { window.SkillAdvance?.monitor.update(hero.id, hero.name, list); } catch { }
                break;
              }
            }
            if (!endpointRef.current) {
              endpointRef.current = '/api/skills/me?heroId=' + encodeURIComponent(hero.id);
              await fetchSkillsOnce();
            }
          } catch (e) {
            if (!live) return;
            setErr(e.message || String(e));
          }
        })();

        pollRef.current = setInterval(fetchSkillsOnce, 1500);

        return () => {
          live = false;
          if (pollRef.current) { clearInterval(pollRef.current); pollRef.current = null; }
        };
      }, [hero && hero.id]);

      useEffect(() => {
        const el = ref.current; if (!el) return;
        el.style.transform = "translateX(-100%)";
        requestAnimationFrame(() => { el.style.transform = "translateX(0)"; });
        return () => { try { el.style.transform = "translateX(-100%)"; } catch { } };
      }, []);

      return (
        <div style={{ position: "fixed", inset: 0, zIndex: 9998, background: "rgba(0,0,0,.35)" }}
          onClick={onClose}>
          <div ref={ref} onClick={e => e.stopPropagation()}
            style={{
              position: "absolute", top: 0, left: 0, height: "100%", width: 360, background: "#0b1220", color: "#e6eef6",
              borderRight: "1px solid rgba(255,255,255,.08)", boxShadow: "0 10px 30px rgba(0,0,0,.45)",
              transition: "transform .25s ease"
            }}>
            {/* Cabeçalho com botão fixo/visível */}
            <div style={{
              position: "relative",
              display: "flex", alignItems: "center",
              padding: "12px 14px", paddingRight: 86,
              borderBottom: "1px solid rgba(255,255,255,.08)"
            }}>
              <div>
                <div style={{ fontSize: 16, fontWeight: 700 }}>{t('app.skillsDrawer.title', { name: hero?.name || t('app.hero.unknown') })}</div>
                <div style={{ fontSize: 11, opacity: .75 }}>{heroMeta(hero, t)}</div>
              </div>
              <button onClick={onClose}
                style={{
                  position: "absolute", right: 12, top: 10,
                  fontSize: 12, padding: "4px 8px", borderRadius: 8, background: "#111827",
                  color: "#e6eef6", border: "1px solid rgba(255,255,255,.06)"
                }}>
                {t('common.close')}
              </button>
            </div>

            {err && <div style={{ padding: 12, color: "#fda4af", fontSize: 13, whiteSpace: "pre-wrap" }}>{err}</div>}

            <div style={{ padding: 12, display: "grid", gap: 8 }}>
              {(rows || []).map((r, i) => {
                const rawName = String(r.skill_type || r.type || r.name || "unknown");
                const normalizedName = rawName.trim();
                const label = translateSkillName(normalizedName, t);
                const lvl = Number(r.level ?? r.lvl ?? 1);
                const levelLabel = t('app.hero.levelShort', { level: formatNumber(lvl) });
                const cur = Number(r.tries_progress ?? r.progress ?? 0);
                const need = Number(r.tries_needed ?? r.needed ?? (r.max || 0));
                const pct = need > 0 ? Math.max(0, Math.min(100, Math.floor((cur / need) * 100))) : 0;
                const keyName = (normalizedName || 'unknown').toLowerCase();

                return (
                  <div key={keyName + "-" + i}
                    style={{
                      padding: 10, borderRadius: 10, background: "rgba(2,6,23,.6)",
                      border: "1px solid rgba(255,255,255,.05)"
                    }}>
                    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                      <div style={{ fontSize: 13, fontWeight: 700 }}>{label}</div>
                      <div style={{ fontSize: 12, opacity: .8 }}>{levelLabel}</div>
                    </div>

                    {/* Barra com label de porcentagem e hover animado */}
                    <div className="skill-bar" title={pct + "%"}>
                      <div className="skill-fill" style={{ width: pct + "%" }} />
                      <div className="skill-label">{pct}%</div>
                    </div>
                  </div>
                );
              })}
              {!rows?.length && !err && (
                <div style={{ fontSize: 12, color: "#9aa4b2" }}>{t('app.skillsDrawer.empty')}</div>
              )}
            </div>
          </div>
        </div>
      );
    }

    /* ============== Mount ============== */
    function TeamAndEquipDemo() {
      return <div style={{ padding: "4px 6px", background: "transparent" }}><TeamShell /></div>;
    }

    (async () => {
      try { await ensureCsrf(); } catch { }
      const mount = document.getElementById("team-root");
      if (!(window.React && window.ReactDOM)) { console.warn("[team-ui] React/ReactDOM indisponíveis"); return; }
      if (!mount) { console.warn("[team-ui] #team-root não encontrado"); return; }
      try { ReactDOM.createRoot(mount).render(<TeamAndEquipDemo />); }
      catch (e) { console.warn("[team-ui] render falhou:", e); }
    })();
  </script>

  <!-- ===== Clique-direito no slot BACK abre a mochila ===== -->
  <script>
    (function () {
      // Resolve sempre o heroId ativo mais confiável
      function getHeroId() {
        return (
          window.ActiveHeroId ||
          (window.Team && typeof Team.getActiveHeroId === 'function' && Team.getActiveHeroId()) ||
          (window.GameScene && GameScene.activeHeroId) ||
          (window.Player && Player.activeHeroId) ||
          window.CurrentHeroId ||
          null
        );
      }

      // Intercepta contextmenu apenas quando o alvo é um slot BACK
      document.addEventListener('contextmenu', function (ev) {
        const slot = ev.target.closest('.slot[data-eq-slot="BACK"], .slot[data-slot="back"], .pf-equip .slot[data-slot="back"]');
        if (!slot) return;

        ev.preventDefault(); // bloqueia o menu do navegador

        const heroId = getHeroId();
        if (!heroId) return;

        try {
          // Preferir open(), senão render()
          if (window.BackpackUI?.open) window.BackpackUI.open(heroId);
          else if (window.BackpackUI?.render) window.BackpackUI.render(heroId);
        } catch (e) {
          console.warn('[backpack] open/render falhou:', e?.message || e);
        }
      }, { capture: true });
    })();
  </script>
