<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>AFK Miners — Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/css/app.css" />
    <style>
      /* segurança: nada de sidebars legadas aparecendo */
      .sidebar, .rightbar { display:none !important; }
    </style>
  </head>

  <body>
    <header class="topbar">
      <div class="brand">AFK MINERS</div>
      <nav class="actions">
        <button id="btnSkills">Skills</button>
        <button id="btnAFK" class="dock-btn">AFK</button>
        <button id="btnFarm" class="dock-btn">Farm</button>
        <button id="btnHeroes">Heroes</button>
        <button id="btnInventory">Inventory</button>
        <button id="btnSummon">Summon</button>
        <button id="btnSettings">Settings</button>
        <button id="btnLogout" class="danger">Logout</button>
      </nav>
    </header>

    <!-- LAYOUT ESTILO TIBIA: esquerda / centro (viewport) / direita -->
    <main id="tibiaLayout">
      <!-- STACK ESQUERDO -->
      <aside id="leftStack" class="stack" aria-label="Left stack"></aside>
      <div id="splitLeft" class="splitter v"></div>

      <!-- VIEWPORT CENTRAL (PRIORIDADE MÁXIMA) -->
      <section id="centerStage">
        <div id="clientShell">
          <!-- id="scene" é usado pelo play.js -->
          <canvas id="scene" width="960" height="540"></canvas>
          <div id="hud" class="hud"></div>
        </div>
      </section>

      <div id="splitRight" class="splitter v"></div>

      <!-- STACK DIREITO (minimapa no topo, painéis abaixo) -->
      <aside id="rightStack" class="stack" aria-label="Right stack">
        <div class="panel mini-map" data-fixed="1" aria-label="Mini map">
          <header><h3>Mini-Map</h3></header>
          <div class="body">
            <canvas id="miniMap" width="140" height="140"></canvas>
          </div>
        </div>
        <!-- os demais painéis entram aqui via JS -->
      </aside>

      <!-- CHAT FIXO EMBAIXO -->
      <footer id="chatDock">
        <div class="chat-controls" style="padding:12px;">
          <div class="chat-tabs" style="display:flex; gap:8px; margin-bottom:8px;">
            <button id="btnDefault" class="chat-tab active" type="button" style="padding:4px 8px">Default</button>
            <button id="btnGlobal"  class="chat-tab"         type="button" style="padding:4px 8px">Global</button>
          </div>

          <div id="chatBox" class="chat-box" style="height:180px; overflow:auto; background:#07101a; padding:8px; color:#e6eef6; border-radius:4px; border:1px solid rgba(255,255,255,0.03);">
            <!-- mensagens carregadas aqui -->
          </div>

          <form id="chatForm" autocomplete="off" style="display:flex; gap:8px; margin-top:8px;">
            <input id="chatInput" name="chat" placeholder="Digite uma mensagem…" style="flex:1; padding:8px; border-radius:4px; border:1px solid rgba(255,255,255,0.04); background:#07121a; color:#fff;" />
            <button id="chatSend" type="button" style="padding:8px 12px; border-radius:4px; background:#2563eb; color:#fff; border:0;">Enviar</button>
          </form>
        </div>
      </footer>
    </main>

    <!-- MODAL SUMMON POP-UP -->
    <div id="summonModal" class="modal" hidden>
      <div class="window">
        <header>
          <h3>Summon</h3>
          <button class="close" aria-label="Close">Close</button>
        </header>
        <iframe id="summonFrame" src="/index.html#summon?embed=1" allow="fullscreen"></iframe>
      </div>
    </div>

    <!-- Scripts de UI existentes -->
    <script src="/js/afk_panel.js"></script>
    <script src="/js/farm_panel.js"></script>

    <!-- Configurações globais + painel de Settings (devem vir antes do app.js) -->
    <script src="/js/settings.js"></script>
    <script src="/js/ui/settings_panel.js"></script>

    <!-- App (module), depois que settings_panel já está disponível -->
    <script type="module" src="/js/app.js"></script>

    <!-- Engine do jogo (ordem importa) + cena -->
    <script src="/js/engine/camera2d.js"></script>
    <script src="/js/engine/input.js"></script>
    <script src="/js/engine/pathfinder.js"></script>
    <script src="/js/engine/player_controller.js"></script>
    <script src="/js/engine/click_to_move.js"></script>
    <script src="/js/play.js"></script>

    <!-- Combate (MÓDULOS) — executa por cima da cena renderizada pelo play.js -->
    <script type="module">
      import { connectCombatWS, combatState } from '/js/combat/ws-combat.js';
      import '/js/combat/render-combat.js';   // já define window.CombatUI
      import '/js/combat/attack-controls.js'; // registra clique/ESC

      // Conecta WS assim que a página carrega
      connectCombatWS();

      // Para debug no console
      window.CombatState = combatState;
    </script>
  </body>
</html>
