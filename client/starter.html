<!-- client/starter.html -->
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Escolha seu Herói</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{
      background:#0b1220;
      color:#e5e7eb;
      font-family:ui-sans-serif,system-ui,Segoe UI,Arial;
      margin:0;
    }
    .wrap{
      max-width:1120px;
      margin:40px auto;
      padding:0 16px;
    }
    h1{font-size:24px;margin:0 0 12px}
    p{opacity:.8;margin:0 0 24px}

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
      gap:20px;
    }

    .card{
      background:#0f172a;
      border:1px solid #1f2937;
      border-radius:14px;
      padding:16px;
      display:flex;
      flex-direction:column;
      gap:10px;
      box-shadow:0 18px 40px rgba(0,0,0,.35);
    }

    .card h3{
      margin:0;
      font-size:18px;
    }

    .meta,
    .stats{
      font-size:12px;
      opacity:.85;
    }

    .stats{
      font-weight:500;
    }

    .sprite{
      height:260px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#111827;
      border:1px solid #1f2937;
      border-radius:10px;
      overflow:hidden;
    }

    .sprite img{
      max-height:100%;
      width:auto;
      display:block;
    }

    .story{
      font-size:13px;
      line-height:1.4;
      opacity:.9;
      min-height:3.2em; /* segura um espaço mesmo quando a lore é curtinha */
    }

    .btn{
      background:#22c55e;
      color:#051016;
      border:none;
      border-radius:10px;
      padding:10px 12px;
      font-weight:700;
      cursor:pointer;
      margin-top:auto; /* empurra o botão pro fim do card */
    }

    .btn[disabled]{
      background:#334155;
      color:#94a3b8;
      cursor:not-allowed;
    }

    .bar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:16px;
      gap:12px;
    }

    .warn{
      font-size:12px;
      opacity:.8;
      max-width:520px;
    }

    .err{
      color:#f87171;
      margin-bottom:12px;
    }

    @media (max-width:768px){
      .wrap{margin:24px auto}
      .sprite{height:220px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar">
      <div>
        <h1>Escolha seu Herói</h1>
        <p class="warn">
          Você poderá obter cópias no gacha depois para subir estrelas.
          Esta escolha só é feita <b>uma vez</b> por conta.
        </p>
      </div>
      <button id="btnSkip" class="btn" style="background:#3b82f6;color:white">
        Ir para o Lobby
      </button>
    </div>

    <div id="err" class="err"></div>
    <div id="grid" class="grid"></div>
  </div>

  <script src="/js/starter.js" defer></script>
</body>
</html>
