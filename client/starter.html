<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Escolha seu Herói</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{background:#0b1220;color:#e5e7eb;font-family:ui-sans-serif,system-ui,Segoe UI,Arial;margin:0}
    .wrap{max-width:960px;margin:40px auto;padding:0 16px}
    h1{font-size:24px;margin:0 0 12px}
    p{opacity:.8;margin:0 0 24px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .card{background:#0f172a;border:1px solid #1f2937;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
    .card h3{margin:0;font-size:18px}
    .meta{font-size:12px;opacity:.85}
    .sprite{height:96px;display:flex;align-items:center;justify-content:center;background:#111827;border:1px solid #1f2937;border-radius:10px}
    .sprite img{image-rendering:pixelated;height:88px}
    .btn{background:#22c55e;color:#051016;border:none;border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer}
    .btn[disabled]{background:#334155;color:#94a3b8;cursor:not-allowed}
    .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
    .warn{font-size:12px;opacity:.8}
    .err{color:#f87171}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar">
      <div>
        <h1>Escolha seu Herói</h1>
        <p class="warn">Você poderá obter cópias no gacha depois para subir estrelas. Esta escolha só é feita <b>uma vez</b> por conta.</p>
      </div>
      <button id="btnSkip" class="btn" style="background:#3b82f6;color:white">Ir para o Lobby</button>
    </div>

    <div id="err" class="err"></div>
    <div id="grid" class="grid"></div>
  </div>

  <script src="/js/starter.js"></script>
</body>
</html>
