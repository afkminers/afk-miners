<!-- client/starter.html -->
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Escolha seu Herói</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{
      background:
        radial-gradient(circle at top, #1e293b 0, #020617 55%, #000 100%);
      background-attachment: fixed;
      color:#e5e7eb;
      font-family:ui-sans-serif,system-ui,Segoe UI,Arial;
      margin:0;
      position:relative;
      overflow-x:hidden;
    }

    /* scanlines/CRT leve */
    body::before{
      content:'';
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(15,23,42,.35) 0,
          rgba(15,23,42,.35) 1px,
          transparent 1px,
          transparent 3px
        );
      opacity:.35;
      mix-blend-mode:soft-light;
      z-index:-1;
    }

    .wrap{
      max-width:1120px;
      margin:40px auto;
      padding:0 16px;
    }
    h1{
      font-size:24px;
      margin:0 0 12px;
      text-shadow:0 0 12px rgba(59,130,246,.6);
    }
    p{opacity:.8;margin:0 0 24px}

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
      gap:20px;
    }

    .card{
      background:#020617;
      border:1px solid #1f2937;
      border-radius:14px;
      padding:16px;
      display:flex;
      flex-direction:column;
      gap:10px;
      box-shadow:0 18px 40px rgba(0,0,0,.6);
      position:relative;
      transition:
        transform .18s ease-out,
        box-shadow .18s ease-out,
        border-color .18s ease-out,
        background-color .18s ease-out;
    }

    .card::before{
      content:'';
      position:absolute;
      inset:-1px;
      border-radius:inherit;
      border:1px solid rgba(56,189,248,0);
      pointer-events:none;
      transition:border-color .18s ease-out, box-shadow .18s ease-out;
    }

    .card:hover{
      transform:translateY(-6px);
      background:#02091a;
      box-shadow:0 26px 60px rgba(15,23,42,.95);
      border-color:#1d4ed8;
    }

    .card:hover::before{
      border-color:rgba(56,189,248,.7);
      box-shadow:0 0 26px rgba(56,189,248,.55);
    }

    .card h3{
      margin:0;
      font-size:18px;
    }

    .meta,
    .stats{
      font-size:12px;
      opacity:.85;
    }

    .stats{
      font-weight:500;
      letter-spacing:.04em;
    }

    .sprite{
      height:260px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:radial-gradient(circle at top,#020617 0,#020617 45%,#020617 60%,#000 100%);
      border:1px solid #1f2937;
      border-radius:10px;
      overflow:hidden;
      position:relative;
    }

    /* halo leve atrás do herói */
    .sprite::before{
      content:'';
      position:absolute;
      width:140%;
      height:60%;
      top:20%;
      left:-20%;
      background:radial-gradient(circle,#38bdf8 0,rgba(56,189,248,0) 60%);
      opacity:.2;
      filter:blur(8px);
      pointer-events:none;
    }

    .sprite img{
      max-height:100%;
      width:auto;
      display:block;
      image-rendering:pixelated;
      animation:floatHero 2.4s ease-in-out infinite;
    }

    .story{
      font-size:13px;
      line-height:1.4;
      opacity:.9;
      min-height:3.2em;
    }

    .btn{
      position:relative;
      background:#22c55e;
      color:#051016;
      border:none;
      border-radius:10px;
      padding:10px 12px;
      font-weight:700;
      cursor:pointer;
      margin-top:auto;
      box-shadow:0 0 0 rgba(34,197,94,.4);
      overflow:hidden;
      transition:
        transform .1s ease-out,
        box-shadow .12s ease-out,
        background-color .1s ease-out;
    }

    .btn::before{
      content:'';
      position:absolute;
      inset:0;
      background:linear-gradient(
        120deg,
        rgba(255,255,255,0),
        rgba(255,255,255,.45),
        rgba(255,255,255,0)
      );
      transform:translateX(-140%);
      opacity:.0;
      pointer-events:none;
    }

    .btn:hover{
      transform:translateY(-1px) scale(1.02);
      box-shadow:0 0 18px rgba(34,197,94,.6);
      background:#16a34a;
    }

    .btn:hover::before{
      opacity:.8;
      animation:btnShine .65s forwards;
    }

    .btn:active{
      transform:translateY(0) scale(.96);
      box-shadow:0 0 8px rgba(22,163,74,.8);
      background:#16a34a;
    }

    .btn[disabled]{
      background:#334155;
      color:#94a3b8;
      cursor:not-allowed;
      box-shadow:none;
    }

    .bar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:16px;
      gap:12px;
    }

    .warn{
      font-size:12px;
      opacity:.8;
      max-width:520px;
    }

    .err{
      color:#f87171;
      margin-bottom:12px;
      min-height:1.2em;
    }

    .err.shake{
      animation:shake .4s ease-out;
    }

    @media (max-width:768px){
      .wrap{margin:24px auto}
      .sprite{height:220px}
    }

    /* ===== Animações ===== */

    @keyframes floatHero{
      0%,100%{transform:translateY(2px);}
      50%{transform:translateY(-4px);}
    }

    @keyframes btnShine{
      to{transform:translateX(140%);}
    }

    @keyframes shake{
      0%,100%{transform:translateX(0);}
      20%,60%{transform:translateX(-4px);}
      40%,80%{transform:translateX(4px);}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar">
      <div>
        <h1>Escolha seu Herói</h1>
        <p class="warn">
          Você poderá obter cópias no gacha depois para subir estrelas.
          Esta escolha só é feita <b>uma vez</b> por conta.
        </p>
      </div>
      <button id="btnSkip" class="btn" style="background:#3b82f6;color:white">
        Ir para o Lobby
      </button>
    </div>

    <div id="err" class="err"></div>
    <div id="grid" class="grid"></div>
  </div>

  <script src="/js/starter.js" defer></script>
</body>
</html>
